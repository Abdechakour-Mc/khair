# Khair runs entirely in containers: the development machine has no
# JavaScript runtime installed and we chose not to add one.
#
#   docker compose up            start the app on http://localhost:3000
#   docker compose run --rm web npm test
#   docker compose run --rm web npm run typecheck

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: khair
      POSTGRES_PASSWORD: khair
      POSTGRES_DB: khair
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khair -d khair"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dbdata:/var/lib/postgresql/data

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run migrate && npm run dev"
    environment:
      DATABASE_URL: postgres://khair:khair@db:5432/khair
      TEST_DATABASE_URL: postgres://khair:khair@db:5432/khair_test
      # The Admin password. Change this before the app is reachable by anyone.
      ADMIN_PASSWORD: change-me
      # Local phone numbers are read as Canadian. See docs/specs for why this
      # is configuration rather than a constant.
      DEFAULT_PHONE_COUNTRY: CA
      # Days are grouped in the mosque's own timezone, not the server's.
      APP_TIMEZONE: America/Toronto
      RETENTION_MONTHS: "6"
      # One deployment, one mosque. See .env.example for why this is config
      # rather than a database entity.
      MOSQUE_NAME: Al-Madinah Center
      MOSQUE_NAME_AR: ""
      MOSQUE_NAME_FR: ""
      MOSQUE_LOGO: ""
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Kept out of the bind mount: native builds must match the container,
      # and OneDrive should never try to sync a node_modules tree.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  node_modules:
  next_cache:
